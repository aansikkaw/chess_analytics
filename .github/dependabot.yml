# Weekly pull requests for new versions of Python packages, GitHub Actions and the Docker base image.
# CI runs the tests and pip-audit on each one; merge when green. Security fixes arrive as soon as they're published.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
