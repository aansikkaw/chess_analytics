# Plateau Breaker on one VPS:  cd deploy && docker compose up -d --build
#
#   caddy      HTTPS (automatic Let's Encrypt certificates) in front of the web app
#   web        the site and API; queues engine work, never runs it
#   worker     Stockfish work from the queue, at lower CPU priority
#   scheduler  daily backups, weekly restore test, weekly digest email
#
# Settings live in deploy/.env (copy .env.example). The database, knowledge bundles and
# dev outbox live in the "data" volume; certificates in "caddy_data".

x-app: &app
  build: ..
  image: plateau-breaker:latest
  env_file: .env
  volumes:
    - data:/data
  restart: unless-stopped

services:
  web:
    <<: *app
    environment:
      JOB_MODE: external
    expose:
      - "8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on: [web]

  scheduler:
    <<: *app
    command: ["python", "-m", "app.scheduler"]
    healthcheck:
      disable: true
    depends_on: [web]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}   # Caddy only needs the domain, not the app's secrets
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  data:
  caddy_data:
  caddy_config:
